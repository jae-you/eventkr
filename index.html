<style>
:root{
  --paper:#F6F7F1; --card:#FFFFFF; --ink:#1C2A22; --muted:#5E6B63; --line:#D9DED3;
  --pine:#24503A; --pine-soft:#E3EEE6; --ginkgo:#E8B91C; --ginkgo-soft:#FBF1CC; --stamp:#C2412D;
  --display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121A15; --card:#18221C; --ink:#E9EEE7; --muted:#A3B0A7; --line:#2C3A31;
  --pine:#7FC39B; --pine-soft:#1F3328; --ginkgo:#F0C842; --ginkgo-soft:#3A3315; --stamp:#E8644F;}}
:root[data-theme="dark"]{
  --paper:#121A15; --card:#18221C; --ink:#E9EEE7; --muted:#A3B0A7; --line:#2C3A31;
  --pine:#7FC39B; --pine-soft:#1F3328; --ginkgo:#F0C842; --ginkgo-soft:#3A3315; --stamp:#E8644F;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 64px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.5px;color:var(--pine)}
.ghost{background:none;border:0;color:var(--muted);font-size:14px;padding:6px 4px;cursor:pointer}
.ghost:focus-visible,.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.pick:focus-visible,.lnk:focus-visible,input:focus-visible{outline:3px solid var(--ginkgo);outline-offset:2px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1.12;margin:0 0 14px;letter-spacing:-.5px}
h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.25;margin:0 0 8px}
h3{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--muted)}
p{margin:0 0 12px}
.lead{color:var(--muted);font-size:15px;margin-bottom:26px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer}
.opt b{display:block;font-size:18px;margin-bottom:2px}
.opt span{color:var(--muted);font-size:14px}
.opt:active{transform:scale(.99)}
.field{margin-bottom:22px}
.field>label{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.field small{color:var(--muted);font-weight:400}
input[type=search]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pick{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.pick em{font-style:normal;color:var(--muted);font-size:12px;margin-left:4px}
.pick.dot::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--stamp);margin-left:6px;vertical-align:middle}
.chosen{display:flex;align-items:center;justify-content:space-between;background:var(--pine-soft);border-radius:12px;padding:12px 14px;font-weight:700}
.chosen button{background:none;border:0;color:var(--pine);font-size:14px;cursor:pointer;padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--paper);font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;background:var(--pine);color:var(--paper);cursor:pointer}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

/* ticket */
.ticket{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px 16px 16px;margin-bottom:18px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);transform:translateY(-50%)}
.ticket::before{left:-10px;clip-path:inset(0 0 0 50%)}
.ticket::after{right:-10px;clip-path:inset(0 50% 0 0)}
.route{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 4px;gap:0}
.stop{flex:1 0 66px;text-align:center;position:relative;min-width:66px}
.stop:not(:last-child)::after{content:"";position:absolute;top:21px;left:calc(50% + 22px);right:calc(-50% + 22px);border-top:2px dashed var(--line)}
.dotc{width:42px;height:42px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;border:2px solid var(--line);background:var(--paper);font-size:11px;font-weight:700;color:var(--muted)}
.stop.ok .dotc{border:2.5px solid var(--stamp);color:var(--stamp);transform:rotate(-12deg);font-family:var(--display);font-size:13px;font-weight:400;background:transparent}
.stop .nm{font-size:13px;font-weight:700;line-height:1.25}
.stop .rl{font-size:11px;color:var(--muted)}
.total{border-top:1.5px dashed var(--line);margin-top:14px;padding-top:14px}
.total .lab{font-size:14px;color:var(--muted)}
.big{font-family:var(--display);font-size:clamp(40px,13vw,56px);line-height:1;color:var(--pine);margin:6px 0 4px}
.plus{display:inline-block;background:var(--ginkgo-soft);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:14px;font-weight:700;margin:4px 0}
.breakdown{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.breakdown li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:var(--muted)}
.breakdown li b{color:var(--ink);white-space:nowrap}

.status{border-radius:16px;padding:16px;margin-bottom:22px}
.status.yes{background:var(--pine-soft)}
.status.no{background:var(--ginkgo-soft)}
.status b{display:block;font-size:17px;margin-bottom:4px}
.status p{font-size:14px;margin:0}

.sec{margin:30px 0 12px}
.near{display:flex;flex-direction:column;gap:8px}
.nrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.nrow .tx{flex:1;min-width:0}
.nrow .tx b{font-size:15px}
.nrow .tx div{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--pine-soft);color:var(--pine)}
.tag.y{background:var(--ginkgo-soft);color:var(--ink)}
.tag.r{background:transparent;border:1px solid var(--stamp);color:var(--stamp)}
.add{border:1.5px solid var(--pine);background:none;color:var(--pine);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.add[aria-pressed="true"]{background:var(--pine);color:var(--paper)}

.phase{margin-top:26px}
.phase-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.phase-h .n{font-family:var(--display);font-size:28px;color:var(--ginkgo);line-height:1}
.phase-h h2{margin:0;font-size:21px}
.step{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.step input{appearance:none;-webkit-appearance:none;flex:0 0 24px;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;margin-top:2px;cursor:pointer;background:var(--card);display:grid;place-items:center}
.step input:checked{background:var(--pine);border-color:var(--pine)}
.step input:checked::after{content:"";width:6px;height:11px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.step .bd{flex:1;min-width:0}
.step .tt{font-weight:700;font-size:15.5px;line-height:1.4}
.step.done .tt{color:var(--muted);text-decoration:line-through}
.step .ds{font-size:14px;color:var(--muted);margin-top:3px}
.step .must{color:var(--stamp);font-weight:700}
.lnks{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.lnk{display:inline-block;text-decoration:none;font-size:13.5px;font-weight:700;padding:7px 11px;border-radius:9px;background:var(--ink);color:var(--paper)}
.lnk.sub{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:var(--ginkgo);transition:width .3s}
.foot{margin-top:40px;font-size:12.5px;color:var(--muted);line-height:1.6}
.recs .nrow{cursor:pointer;text-align:left;width:100%;font:inherit}
.recs .rank{font-family:var(--display);font-size:22px;color:var(--muted);width:26px;text-align:center}
.fall{font-size:12.5px;color:var(--stamp);margin-top:2px}
details.qa{border-top:1px solid var(--line);padding:4px 0}
details.qa summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none}
details.qa summary::after{content:"+";float:right;color:var(--muted);font-weight:400}
details.qa[open] summary::after{content:"−"}
details.qa p{font-size:15px;color:var(--ink)}
body.big{zoom:1.2}
.ghost[aria-pressed="true"]{color:var(--pine);font-weight:700}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates label,.cmpin label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:400}
input[type=date],input[type=number]{width:100%;padding:11px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:16px;min-width:0}
.dlist{list-style:none;margin:0;padding:0}
.dlist li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.dlist small{color:var(--muted);font-size:12.5px}
.dlist em{font-style:normal;font-weight:700;font-size:13px;white-space:nowrap;padding:3px 9px;border-radius:7px}
.dlist .ok em{background:var(--pine-soft);color:var(--pine)}
.dlist .half em{background:var(--ginkgo-soft);color:var(--ink)}
.dlist .no em{border:1px solid var(--stamp);color:var(--stamp)}
.cmpin{display:grid;grid-template-columns:.7fr 1.2fr 1.1fr;gap:8px;margin-bottom:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp .col{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.cmp h3{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink);margin:0 0 8px}
.cmp .r{padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.cmp .r span{display:block;color:var(--muted)}
.cmp .r b{font-size:15px}
.cmp .r small{font-weight:400;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.55}
.note b{color:var(--ink)}
.verdict{background:var(--ginkgo-soft);border-radius:14px;padding:14px;margin-top:12px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const rad = d=>d*Math.PI/180;
function km(a,b){const R=6371,dl=rad(b.lat-a.lat),dg=rad(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function segKm(p,a,b){const c=Math.cos(rad(p.lat));const X=q=>(q.lng-p.lng)*111.32*c,Y=q=>(q.lat-p.lat)*110.57;
  const ax=X(a),ay=Y(a),bx=X(b),by=Y(b),dx=bx-ax,dy=by-ay;const L2=dx*dx+dy*dy;
  let t=L2?((-ax)*dx+(-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(ax+t*dx,ay+t*dy);}

/* ===== 플랜 계산 ===== */
function computePlan(){
  const o=byId(S.origin),d=byId(S.dest),v=S.via&&byId(S.via);
  const pts=[o,v,d].filter(Boolean);
  const used=new Set(pts.map(p=>p.id));
  const cands=PLACES.filter(p=>p.decline&&!used.has(p.id)).map(p=>{
    let dr=Infinity;for(let i=0;i<pts.length-1;i++)dr=Math.min(dr,segKm(p,pts[i],pts[i+1]));
    return {p,dd:km(p,d),dr,dO:km(p,o)};
  }).filter(x=>x.dO>30&&(x.dd<=35||x.dr<=25))
    .map(x=>({...x,kind:x.dd<=35?'목적지 근처':'가는 길'}))
    .sort((a,b)=>weight(b.p)-weight(a.p)||Math.min(a.dd,a.dr)-Math.min(b.dd,b.dr)).slice(0,6);
  const extras=S.extras.map(byId).filter(Boolean);
  const visited=[v,...extras,d].filter(Boolean);
  const dv=visited.filter(p=>p.decline);
  const M=m=>S.modes.includes(m);
  const drive=M('car')||M('rent');
  const stamps=dv.filter(p=>km(p,o)>=30).length;
  const b={};
  b.train = M('train') && dv.filter(p=>p.ktx);
  b.half = dv.filter(p=>p.half);
  b.bonus = dv.filter(p=>p.bonus);
  b.tmap = drive && stamps ? [0,5000,15000,30000][Math.min(3,stamps)] : 0;
  b.tmapEv = b.tmap && S.car==='ev' ? 2000 : 0;
  b.island = S.stay==='hotel' && dv.some(p=>p.island);
  b.nonCap = !CAPITAL.has(d.prov);
  b.rent = M('rent') && b.nonCap;

  const total=parts.reduce((s,x)=>s+x[1],0);

  if(trainOK){
    ph[0].push(step('ktx-buy','기차 · 필수','일반 승차권 말고 「인구감소지역행 자유여행상품」으로 예매',`${names(b.train)} 행 상품을 사야 기차표값 100%가 기차 할인권으로 돌아와요. 관광공사·코레일이 절반씩 부담하는 구조예요.`,lk('korail'),true));
    ph[0].push(step('ktx-extra','기차','테마열차 50% · 내일로 패스 2만원 할인 같이 보기','5개 노선 테마열차와 내일로 패스 할인이 추가로 붙어요.',lk('korail',1)));
  } else if(M('train')&&!d.decline){
    ph[0].push(step('ktx-none','기차','목적지 대신 대상 지역행 상품을 찾아보기','기차표 전액 환급은 코레일과 협약한 41개 인구감소지역행 상품만 해당돼요. 위 「들렀다 가면」 목록에 기차 아이콘이 있는 곳을 확인해 보세요.',lk('korail',1)));
  }
  if(S.stay==='hotel'&&b.nonCap){
    ph[0].push(step('stay-coupon','숙소',`숙박세일페스타 할인권 받고 예약하기`,`비수도권 숙소 할인권 약 8만장이 1인 1매 선착순으로 풀려요. 숙박앱에서 쿠폰을 먼저 받은 뒤 결제하세요. <b>11월 8일까지만 사용</b>할 수 있고, 지역별 수량이 달라요.${b.island?' 섬 숙소는 7만원 이상이면 5만원, 미만이면 3만원 할인돼요.':''}`,lk('yanolja')+lk('yeogi')+lk('interpark')+lk('stay',1)));
  }
  if(S.stay==='camp'){
    ph[0].push(step('camp','캠핑','캠핑장 할인권 받기','11월 28일까지 캠핑 예약 플랫폼에서 발급받을 수 있어요.',lk('campingtalk')+lk('camfit')));
  }
  if(P.drive){
    ph[0].push(step('tmap-pledge','티맵 · 필수','티맵 앱에서 「친환경 안전 여행 서약」 하기','티맵 앱의 이벤트 화면에서 서약 버튼을 한 번 눌러 두면 돼요. 이 이벤트 자세한 화면은 티맵 앱 안에서만 볼 수 있어요. 기간은 10월 1일부터 11월 30일까지예요.',lk('tmap'),true));
  }
  if(b.rent){
    ph[0].push(step('rent','렌터카','렌터카 할인 대상 지역·차종 확인 후 예약',`수도권 제외 64개 연안 시군구에서 14시간 대여 시 1만원, 48시간 대여 시 2만원 할인(제주는 5천원·1만원). 하이브리드·전기·가스 차량만, <b>10월 한 달만</b> 적용돼요. 목적지가 연안 지역인지와 참여 업체를 안내 페이지에서 먼저 확인하세요.`,lk('sea')+lk('socar',1)));
  }
  if(b.air){
    ph[0].push(step('air','항공',`네이버 항공권으로 김포→${b.air.to} 예약`,`이 경로로 사야 1인당 ${won(b.air.amt)} 네이버페이 포인트가 나와요. 예약 1건당 최대 4명, 11월 30일까지.`,lk('naverair')));
  } else if(M('air')){
    ph[0].push(step('air-no','항공','항공 혜택 노선 확인','내륙은 김포에서 광주·울산·여수·포항·사천 노선, 제주는 1인 5천원 포인트예요. 목적지 근처 공항이 이 중 하나인지 보세요.',lk('naverair',1)));
  }
  if(S.worker){
    ph[0].push(step('worker','노동자 휴가지원','휴가샵에서 여행상품 50% 할인 확인','노동자 휴가지원 참여자는 최대 50%(5만원 한도) 할인받을 수 있어요.',lk('benepia')));
  }
  // 가는 길
  if(P.drive&&P.dv.length){
    ph[1].push(step('tmap-nav','티맵','들르는 대상 지역마다 티맵 목적지로 설정해 주행',`<b>차에 달린 내비나 카카오내비로 가면 인정이 안 돼요.</b> 휴대폰 티맵에 그 지역 관광명소를 목적지로 넣고 길안내를 켠 채로, 출발지에서 30km 넘게 달려 도착해야 도장이 찍혀요. 첫 번째 지역 5천, 두 번째 1만, 세 번째 1만5천 포인트로 세 곳이면 3만 포인트예요. 같은 지역은 두 번 쳐주지 않고, 내가 사는 지역은 빠져요. 이번 여정 대상: ${names(P.dv)}.`,lk('tmap',1)));
  }
  if(trainOK){
    ph[1].push(step('ktx-ticket','기차','상품 승차권과 QR 인증 위치 미리 확인','도착해서 인증할 지정 여행지가 어디인지 상품 안내에서 봐 두세요.',''));
  }
  // 도착해서
  if(trainOK){
    ph[2].push(step('ktx-qr','기차 · 필수','지정 여행지에서 QR 코드로 방문 인증',`인증해야 기차표값 100%짜리 할인권이 지급돼요.`,'',true));
  }
  if(b.half.length){
    ph[2].push(step('half-receipt','반값 환급 · 필수','영수증·카드 전표 모두 챙기기','<b>카드로 긁으면 인정 안 되는 지역이 많아요.</b> 상당수 지자체는 그 지역 모바일 상품권(제로페이 앱 등)으로 낸 것만 인정하고, 숙박만 카드·현금영수증을 예외로 쳐줘요. 여행 경비는 보통 최소 10만원 이상, 지정 관광지 2곳 이상 인증 사진(일행 전원 얼굴 + 관광지)도 요구해요.'+(S.stay==='friend'?' 숙박비가 없으니 식당·체험·현지 장보기로 10만원을 채워야 해요.':'')+' 정확한 조건은 신청한 지자체 안내를 따르세요.','',true));
  }
  if(b.bonus.length){
    ph[2].push(step('bonus','온누리상품권',`${names(b.bonus)} 방문 온누리상품권 2만원`,'상반기 방문객이 적었던 13곳 추가 혜택이에요. 선착순 2천명 한정이라 일찍 갈수록 유리해요.',lk('month',1)));
  }
  if(S.stay==='friend') ph[2].push(step('gift','지인 집','신세 지는 집에 줄 장보기·선물은 현지에서','그 지역 시장이나 가게에서 사면 온누리상품권·지역사랑상품권을 쓸 수 있고, 반값 환급 대상 지역이라면 지출 증빙으로도 남아요.',''));
  b.local.forEach((l,i)=>ph[2].push(step('local'+i,'현지 할인',l.t,l.d,'')));
  ph[2].push(step('temple','더 아끼기','템플스테이 50% · 농촌 투어패스 40%','전국 공통 할인이에요. 일정에 맞으면 붙여 보세요.',lk('temple',1)));
  // 다녀와서
  if(b.half.length){
    ph[3].push(step('half-claim','반값 환급','지출 증빙 제출 → 모바일 지역사랑상품권 받기',`1인 최대 ${S.youth?'14만원(청년)':'10만원'}. 제출 기한을 놓치지 마세요. 받은 상품권은 해당 지역에서 다시 쓸 수 있어요.`,lk('month',1)));
  }
  if(trainOK) ph[3].push(step('ktx-voucher','기차','기차 할인권 들어왔는지 확인','현금이 아닌 다음 기차표 할인권으로 돌아와요. 사용 기한을 확인해 두세요.',lk('korail',1)));
  if(P.drive&&P.dv.length) ph[3].push(step('tmap-review','티맵','후기 영상 올리고 포인트 추가 받기','티맵에 영상 후기를 올리면 2천포인트, 방문 지역에서 디지털 관광주민증을 쓰면 5천포인트를 따로 더 줘요.',lk('tmap',1)));
  if(b.air) ph[3].push(step('air-pt','항공','네이버페이 포인트 적립 확인','',lk('naverair',1)));
  ph[3].push(step('festa','덤','10/29~11/15 코리아 그랜드 페스티벌','디지털 온누리상품권·지역사랑상품권 할인이 열려요.',''));

  const all=ph.flat().length, doneN=ph.flat().filter(s=>s.includes('class="step done"')).length;
  const titles=['출발 전','가는 길','도착해서','다녀와서'];
  const phases=ph.map((list,i)=>list.length?`<section class="phase"><div class="phase-h"><span class="n">${i+1}</span><h2>${titles[i]}</h2></div>${list.join('')}</section>`:'').join('');

  return `${header('dest')}
    ${status}${dateCheck(P)}${compare(P)}${ticket}${howBack(P)}${near}${faq()}
    <div class="sec"><h2>돌려받기 체크리스트</h2>
    <div class="prog" role="progressbar" aria-valuenow="${doneN}" aria-valuemax="${all}"><i style="width:${all?doneN/all*100:0}%"></i></div>
    <p class="hint">${doneN}/${all} 완료 · 체크는 이 기기에 저장돼요</p></div>
    ${phases}
    <div style="margin-top:28px;display:grid;gap:10px">
      <button class="btn alt" data-a="go" data-v="dest">여정 수정하기</button>
      <button class="ghost" data-a="reset">처음부터 다시</button>
    </div>
    <p class="foot">금액은 기사에 나온 상한선을 더한 값이고, 실제 환급은 지출액·선착순 수량·지자체 승인에 따라 달라져요. 지역사랑 휴가지원 대상은 기사에 언급된 지역만 표시했으니, 다른 지역도 ${L.month[0]} 누리집에서 확인해 보세요. 렌터카 연안 지역 여부도 안내 페이지 확인이 필요해요.</p>`;
}

/* ===== 렌더 & 이벤트 ===== */
function render(){document.body.classList.toggle('big',!!S.bigText);app.innerHTML=(SCREENS[S.screen]||SCREENS.start)();save();}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,v=t.dataset.v,f=t.dataset.f;
  if(a==='check')return;
  if(a==='mode'){S.screen=v;}
  else if(a==='go'){S.screen=v;window.scrollTo(0,0);}
  else if(a==='pick'){S[f]=v;if(f!=='origin')S.extras=[];}
  else if(a==='clear'){S[v]=null;S.extras=[];}
  else if(a==='toggle'){const arr=S[f];const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);}
  else if(a==='setone'){S[f]=v;}
  else if(a==='flag'){S[v]=!S[v];if(v!=='bigText')S.noneSel=false;}
  else if(a==='none'){S.youth=false;S.worker=false;S.noneSel=true;}
  else if(a==='choose'){S.dest=v;S.via=null;S.extras=[];S.screen='dest';window.scrollTo(0,0);}
  else if(a==='extra'){const i=S.extras.indexOf(v);i>=0?S.extras.splice(i,1):S.extras.push(v);}
  else if(a==='reset'){S={...S,screen:'start',origin:null,dest:null,via:null,extras:[],checks:{}};window.scrollTo(0,0);}
  const y=window.scrollY;render();if(a==='extra'||a==='toggle'||a==='flag'||a==='setone'||a==='pick'||a==='clear')window.scrollTo(0,y);
});
app.addEventListener('change',e=>{
  const t=e.target;if(t.dataset.a!=='check')return;
  S.checks[t.dataset.v]=t.checked;const y=window.scrollY;render();window.scrollTo(0,y);
});
app.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset.in)return;S[t.dataset.in]=t.value;
  if(t.dataset.in==='depart'&&S.ret&&S.ret<t.value)S.ret=t.value;
  const y=window.scrollY;render();window.scrollTo(0,y);
});
app.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset.f)return;
  const box=app.querySelector(`[data-list="${t.dataset.f}"]`);if(box)box.innerHTML=pickList(t.dataset.f,t.value);
});
render();
</script>
